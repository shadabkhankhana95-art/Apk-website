<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card App — Unofficial Demo</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #fff3cd;
      color: #856404;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    .download {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: #2446a8;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .download:hover {
      opacity: 0.9;
    }

    .note {
      font-size: 12px;
      margin-top: 20px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="badge">UNOFFICIAL DEMO</div>

    <h1>Card App Demo</h1>

    <p>
      This is a demonstration download page.
      It is not affiliated with or endorsed by any bank or financial institution.
    </p>

    <a class="download" href="RBL.apk" download>
      Download Demo APK
    </a>

    <p class="note">
      Demo/testing purpose only.
    </p>

  </div>

</body>
</html>
